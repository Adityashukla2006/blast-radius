[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blast-radius"
version = "0.0.1"
description = "Predict which parts of a Python codebase a change could break."
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23,<0.26",   # 0.26.0 segfaults on Windows (node.parent walks + start_point)
    "tree-sitter-python>=0.23",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
blast-radius = "blast_radius.cli:main"

[tool.setuptools.packages.find]
include = ["blast_radius*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
